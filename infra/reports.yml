AWSTemplateFormatVersion: '2010-09-09'
Description: Weekly meetings report architecture - S3, SQS+DLQ, Builder Lambda, Mailer Lambda, SES

Parameters:
  ProjectName:
    Type: String
    Default: spry
  VpcId:
    Type: String
  SubnetIds:
    Type: CommaDelimitedList
  SecurityGroupId:
    Type: String
  BuilderImageUri:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true
  RecipientEmail:
    Type: String
    Description: Verified SES email address to receive reports

Resources:
  # 1. Приватний S3 бакет
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerLambdaPermission
    Properties:
      BucketName: !Sub '${ProjectName}-reports-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
            Function: !GetAtt MailerFunction.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # 2. SQS Черги (DLQ + Основна)
  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-report-requests-dlq'

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-report-requests'
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3

  # 3. IAM Роль та Lambda report-builder (у VPC)
  BuilderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-builder-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*'
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-report-builder'
      PackageType: Image
      Code:
        ImageUri: !Ref BuilderImageUri
      ImageConfig:
        EntryPoint:
          - "python"
          - "-m"
          - "awslambdaric"
        Command:
          - app.reports.lambda_handler.handler
      Role: !GetAtt BuilderExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          REPORTS_BUCKET: !Sub '${ProjectName}-reports-${AWS::AccountId}'
          DATABASE_URL: !Ref DatabaseUrl
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # 4. Мапінг SQS -> Builder Lambda
  BuilderSQSMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction

  # 5. EventBridge Scheduler -> SQS
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendSQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-weekly-report-schedule'
      ScheduleExpression: 'cron(0 8 ? * MON *)'
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "schedule", "week": null}'

  # 6. Lambda report-mailer (поза VPC) та дозволи
  MailerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-mailer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*'
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-report-mailer'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt MailerExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import os, boto3, logging
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          s3 = boto3.client('s3')
          ses = boto3.client('ses')

          def handler(event, context):
              log.info("report-mailer triggered", extra={"trigger": "s3", "event": event})
              record = event['Records'][0]['s3']
              bucket = record['bucket']['name']
              key = record['object']['key']

              obj = s3.get_object(Bucket=bucket, Key=key)
              file_bytes = obj['Body'].read()

              recipient = os.environ['RECIPIENT_EMAIL']
              sender = os.environ.get('SENDER_EMAIL', recipient)

              msg = MIMEMultipart()
              msg['Subject'] = f"Weekly Meetings Report ({os.path.basename(key)})"
              msg['From'] = sender
              msg['To'] = recipient

              msg.attach(MIMEText("Please find attached the requested weekly report CSV file.", "plain"))
              att = MIMEApplication(file_bytes)
              att.add_header('Content-Disposition', 'attachment', filename=os.path.basename(key))
              msg.attach(att)

              ses.send_raw_email(Source=sender, Destinations=[recipient], RawMessage={'Data': msg.as_bytes()})
              log.info("report-mailer sent email", extra={"recipient": recipient, "key": key})
              return {"status": "sent", "key": key}
      Environment:
        Variables:
          RECIPIENT_EMAIL: !Ref RecipientEmail
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt MailerFunction.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}'

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
  BuilderFunctionName:
    Value: !Ref BuilderFunction
  MailerFunctionName:
    Value: !Ref MailerFunction
