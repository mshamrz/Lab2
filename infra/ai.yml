AWSTemplateFormatVersion: '2010-09-09'
Description: Paste an agenda - agenda-parser Lambda (outside the VPC) with a function URL, calls Claude on Bedrock
 
Parameters:
  ProjectName:
    Type: String
    Default: spry
  ImageUri:
    Type: String
    Description: Same backend Lambda image that report-builder uses
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  AppDomain:
    Type: String
    Default: localhost
    Description: Deployed site domain, used for CORS
  ParserModel:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
 
Resources:
  ParserExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-agenda-parser-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeClaude
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Converse via a cross-region inference profile needs the profile
              # and the foundation model in the regions the profile routes to.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6'
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
 
  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-agenda-parser'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint:
          - "python"
          - "-m"
          - "awslambdaric"
        Command:
          - app.ai.agenda_lambda.handler
      Role: !GetAtt ParserExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      # No VpcConfig: this function needs no database.
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          USER_POOL_ID: !Ref UserPoolId
          CLIENT_ID: !Ref UserPoolClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
 
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - 'http://localhost:5173'
          - !Sub 'https://${AppDomain}'
        AllowMethods:
          - POST
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 3600
 
  # Public URL permissions (the handler checks the Cognito token itself)
  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ParserFunction
      Principal: '*'
      FunctionUrlAuthType: NONE
 
  ParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ParserFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
 
Outputs:
  ParserFunctionName:
    Value: !Ref ParserFunction
  ParserUrl:
    Value: !GetAtt ParserUrl.FunctionUrl
 
Claude finished the response
