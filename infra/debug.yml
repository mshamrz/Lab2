AWSTemplateFormatVersion: '2010-09-09'
Description: Debug - Lambda function and schedule

Parameters:
  ProjectName:
    Type: String
    Default: spry
  SubnetIds:
    Type: CommaDelimitedList
  SecurityGroupId:
    Type: String
  BuilderImageUri:
    Type: String
  DatabaseUrl:
    Type: String
    NoEcho: true

Resources:
  BuilderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-debug-builder-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: WriteReports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*'

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-debug-report-builder'
      PackageType: Image
      Code:
        ImageUri: !Ref BuilderImageUri
      Role: !GetAtt BuilderExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          REPORTS_BUCKET: !Sub '${ProjectName}-reports-${AWS::AccountId}'
          DATABASE_URL: !Ref DatabaseUrl

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-debug-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeBuilder
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BuilderFunction.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-debug-weekly-report-schedule'
      ScheduleExpression: 'cron(0 7 ? * MON *)'
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt BuilderFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: '{"source": "schedule"}'

Outputs:
  BuilderFunctionArn:
    Value: !GetAtt BuilderFunction.Arn
